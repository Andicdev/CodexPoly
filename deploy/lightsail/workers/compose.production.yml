name: codexpoly-production-workers

services:
  earnings-worker:
    image: "${CODEXPOLY_IMAGE_REF:?set CODEXPOLY_IMAGE_REF}"
    command: ["python", "-u", "-m", "cbr_trading.earnings"]
    restart: unless-stopped
    init: true
    environment:
      PYTHONUNBUFFERED: "1"
      LOG_LEVEL: INFO
      PRIMARY_DB_TARGET: server_int
      DATABASE_HOST: postgres
      DATABASE_PORT: "5432"
      DATABASE_NAME: codexpoly
      DATABASE_USER: codexpoly_app
      DATABASE_APP_PASSWORD_FILE: /run/secrets/DATABASE_APP_PASSWORD
      EARNINGS_WORKER_MODE: shadow
      EARNINGS_HTTP_USER_AGENT: "${EARNINGS_HTTP_USER_AGENT:?set an approved SEC user agent}"
      EARNINGS_FETCH_TIMEOUT_SEC: "15"
      EARNINGS_MAX_DOCUMENT_BYTES: "8388608"
      EARNINGS_FETCH_ATTEMPTS: "3"
      EARNINGS_FETCH_RETRY_SEC: "0.5"
      EARNINGS_RECONNECT_INITIAL_SEC: "1"
      EARNINGS_RECONNECT_MAX_SEC: "30"
      EARNINGS_NO_RULES_RETRY_SEC: "30"
      EARNINGS_HEARTBEAT_SEC: "60"
      EARNINGS_PUBLIC_SOURCES_ENABLED: "true"
      # Public polling is profile-window gated. Half-second cadence keeps
      # official IR/wire detection competitive without running continuously.
      EARNINGS_PUBLIC_POLL_SEC: "0.5"
      # Fail fast per host so a degraded IR site cannot block candidates
      # that already arrived from another official source.
      EARNINGS_PUBLIC_LISTING_TIMEOUT_SEC: "2"
      EARNINGS_PUBLIC_DOCUMENT_TIMEOUT_SEC: "5"
      # Official SEC submissions polling is also profile-window gated.
      # Requests are paced globally below the SEC fair-access ceiling.
      EARNINGS_SEC_CURRENT_POLL_ENABLED: "true"
      EARNINGS_SEC_CURRENT_POLL_SEC: "0.25"
      EARNINGS_SEC_CURRENT_MAX_REQUESTS_PER_SEC: "5"
      MSTR_BTC_SHADOW_ENABLED: "true"
      MSTR_BTC_LEDGER_ENABLED: "true"
      MSTR_BTC_LEDGER_URL: "https://www.strategy.com/ledger"
      MSTR_BTC_LEDGER_POLL_SEC: "2"
      MSTR_BTC_LEDGER_TIMEOUT_SEC: "10"
      NEWS_NOTIFICATION_DELIVERY_DELAY_SEC: "2"
      SEC_API_KEY_FILE: /run/secrets/SEC_API_KEY
    secrets:
      - source: database_app_password
        target: DATABASE_APP_PASSWORD
      - source: sec_api_key
        target: SEC_API_KEY
    networks:
      - backend
      - egress
    dns:
      - 169.254.169.253
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=32m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 150
    mem_limit: 256m
    mem_reservation: 128m
    cpus: 0.50
    stop_grace_period: 20s
    logging:
      driver: local
      options:
        max-size: 10m
        max-file: "3"

  notification-worker:
    image: "${CODEXPOLY_IMAGE_REF:?set CODEXPOLY_IMAGE_REF}"
    command: ["python", "-u", "-m", "cbr_trading.notifications"]
    restart: unless-stopped
    init: true
    environment:
      PYTHONUNBUFFERED: "1"
      LOG_LEVEL: INFO
      PRIMARY_DB_TARGET: server_int
      DATABASE_HOST: postgres
      DATABASE_PORT: "5432"
      DATABASE_NAME: codexpoly
      DATABASE_USER: codexpoly_app
      DATABASE_APP_PASSWORD_FILE: /run/secrets/DATABASE_APP_PASSWORD
      TG_BOT_TOKEN_FILE: /run/secrets/TG_BOT_TOKEN
      TELEGRAM_INGEST_CHAT_ID_FILE: /run/secrets/TELEGRAM_INGEST_CHAT_ID
      NEWS_TELEGRAM_TIMEOUT_SEC: "10"
      NEWS_NOTIFICATION_POLL_SEC: "0.5"
      NEWS_NOTIFICATION_RETRY_SEC: "10"
      NEWS_NOTIFICATION_LEASE_SEC: "30"
      NEWS_NOTIFICATION_HEARTBEAT_SEC: "60"
    secrets:
      - source: database_app_password
        target: DATABASE_APP_PASSWORD
      - source: telegram_bot_token
        target: TG_BOT_TOKEN
      - source: telegram_ingest_chat_id
        target: TELEGRAM_INGEST_CHAT_ID
    networks:
      - backend
      - egress
    dns:
      - 169.254.169.253
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=16m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 100
    mem_limit: 192m
    mem_reservation: 96m
    cpus: 0.25
    stop_grace_period: 20s
    logging:
      driver: local
      options:
        max-size: 10m
        max-file: "3"

  profile-scheduler-worker:
    image: "${CODEXPOLY_IMAGE_REF:?set CODEXPOLY_IMAGE_REF}"
    command: ["python", "-u", "-m", "cbr_trading.profile_lifecycle"]
    restart: unless-stopped
    init: true
    environment:
      PYTHONUNBUFFERED: "1"
      LOG_LEVEL: INFO
      PRIMARY_DB_TARGET: server_int
      DATABASE_HOST: postgres
      DATABASE_PORT: "5432"
      DATABASE_NAME: codexpoly
      DATABASE_USER: codexpoly_app
      DATABASE_APP_PASSWORD_FILE: /run/secrets/DATABASE_APP_PASSWORD
      PROFILE_SCHEDULER_POLL_SEC: "2"
      PROFILE_SCHEDULER_HEARTBEAT_SEC: "60"
      PROFILE_SCHEDULER_ACTIVATION_GRACE_SEC: "60"
      PROFILE_SCHEDULER_LIVE_HEARTBEAT_STALE_SEC: "15"
      PROFILE_SCHEDULER_BATCH_SIZE: "100"
      PROFILE_SCHEDULER_AUTO_LIVE_ENABLED: "${PROFILE_SCHEDULER_AUTO_LIVE_ENABLED:-0}"
      PROFILE_SCHEDULER_MAX_TOTAL_NOTIONAL: "${PROFILE_SCHEDULER_MAX_TOTAL_NOTIONAL:-}"
    secrets:
      - source: database_app_password
        target: DATABASE_APP_PASSWORD
    networks:
      - backend
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=16m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 100
    mem_limit: 192m
    mem_reservation: 96m
    cpus: 0.25
    stop_grace_period: 20s
    logging:
      driver: local
      options:
        max-size: 10m
        max-file: "3"

  resolution-worker:
    image: "${CODEXPOLY_IMAGE_REF:?set CODEXPOLY_IMAGE_REF}"
    command: ["python", "-u", "-m", "cbr_trading.resolution_hosted"]
    restart: unless-stopped
    init: true
    environment:
      PYTHONUNBUFFERED: "1"
      LOG_LEVEL: INFO
      PRIMARY_DB_TARGET: server_int
      DATABASE_HOST: postgres
      DATABASE_PORT: "5432"
      DATABASE_NAME: codexpoly
      DATABASE_USER: codexpoly_app
      DATABASE_APP_PASSWORD_FILE: /run/secrets/DATABASE_APP_PASSWORD
      RESOLUTION_ORCHESTRATOR_MODE: shadow
      # Interim low-latency bridge until cross-process fact wakeups replace
      # database polling. Only workers with managed profiles hit the store.
      RESOLUTION_ORCHESTRATOR_POLL_SEC: "0.05"
      RESOLUTION_ORCHESTRATOR_HEARTBEAT_SEC: "30"
      RESOLUTION_ORCHESTRATOR_NO_PROFILES_SEC: "30"
      RESOLUTION_ORCHESTRATOR_PROFILE_REFRESH_SEC: "2"
      RESOLUTION_RUNTIME_HEARTBEAT_SEC: "5"
      RESOLUTION_RUN_JOURNAL_RECONCILE_SEC: "2"
      RESOLUTION_SUPERVISION_ENABLED: "0"
    secrets:
      - source: database_app_password
        target: DATABASE_APP_PASSWORD
    networks:
      - backend
      - egress
    dns:
      - 169.254.169.253
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=32m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 200
    mem_limit: 384m
    mem_reservation: 192m
    cpus: 0.75
    stop_grace_period: 30s
    logging:
      driver: local
      options:
        max-size: 10m
        max-file: "3"

networks:
  backend:
    name: codexpoly-production-backend
    external: true
  egress:
    name: codexpoly-production-egress
    driver: bridge

secrets:
  database_app_password:
    file: /opt/codexpoly/secrets/prod/DATABASE_APP_PASSWORD
  sec_api_key:
    file: /opt/codexpoly/secrets/prod/SEC_API_KEY
  telegram_bot_token:
    file: /opt/codexpoly/secrets/prod/TG_BOT_TOKEN
  telegram_ingest_chat_id:
    file: /opt/codexpoly/secrets/prod/TELEGRAM_INGEST_CHAT_ID
