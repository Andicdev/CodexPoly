name: codexpoly-staging-db

services:
  postgres:
    image: postgres:18.4-bookworm
    restart: unless-stopped
    environment:
      POSTGRES_DB: codexpoly
      POSTGRES_USER: codexpoly_admin
      POSTGRES_PASSWORD_FILE: /run/secrets/POSTGRES_PASSWORD
      DATABASE_APP_PASSWORD_FILE: /run/secrets/DATABASE_APP_PASSWORD
      PGDATA: /var/lib/postgresql/18/docker
    command:
      - postgres
      - -c
      - max_connections=30
      - -c
      - shared_buffers=64MB
      - -c
      - effective_cache_size=192MB
      - -c
      - maintenance_work_mem=32MB
      - -c
      - work_mem=4MB
      - -c
      - wal_compression=on
      - -c
      - log_connections=off
      - -c
      - log_disconnections=off
    volumes:
      - postgres_data:/var/lib/postgresql
      - ./init/10-app-role.sh:/docker-entrypoint-initdb.d/10-app-role.sh:ro
    secrets:
      - source: postgres_password
        target: POSTGRES_PASSWORD
      - source: database_app_password
        target: DATABASE_APP_PASSWORD
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks:
      - backend
    mem_limit: 384m
    mem_reservation: 192m
    cpus: 0.75
    pids_limit: 200
    shm_size: 64m
    security_opt:
      - no-new-privileges:true
    logging:
      driver: local
      options:
        max-size: 10m
        max-file: "3"

volumes:
  postgres_data:
    name: codexpoly_staging_postgres_data

networks:
  backend:
    name: codexpoly-staging-backend
    internal: true

secrets:
  postgres_password:
    file: /home/codexdeploy/.config/codexpoly/secrets/staging/POSTGRES_PASSWORD
  database_app_password:
    file: /home/codexdeploy/.config/codexpoly/secrets/staging/DATABASE_APP_PASSWORD
